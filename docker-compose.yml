version: '3.8'

# Two data-plane containers on the Compose network: ArcadeDB (JVM) + Redis.
# Node talks to ArcadeDB over http://arcadedb:2480 with HTTP Basic auth
# (ARCADEDB_USER / ARCADEDB_PASSWORD). Do not publish 2480 in production.

services:
  arcadedb:
    image: arcadedata/arcadedb:26.5.1
    ports:
      - "2480:2480"
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:-arcadedb}
        -Darcadedb.server.mode=development
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2480'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  redis:
    image: redis:7-alpine
    ports:
      # Host 6379 is often taken by other local Redis containers; publish 6380 for host Node.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

