openapi: 3.0.3
info:
  title: Vector Client API
  description: API for managing endpoints, schemas (knowledge base), scrape sources, native AI agents, tokens, and logs.
  version: 1.1.0

servers:
  - url: http://localhost:3001
    description: Default local server

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email, displayName]
              properties:
                username: { type: string, minLength: 3 }
                password: { type: string, minLength: 8 }
                email: { type: string, format: email }
                displayName: { type: string, minLength: 2 }
      responses:
        '200':
          description: Registration result (e.g. user and token)
        '400':
          description: Validation error

  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login result (e.g. token)
        '401':
          description: Unauthorized

  /api/tokens:
    get:
      summary: List API tokens
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
    post:
      summary: Create API token
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenName: { type: string }
                expiresIn: { type: integer, description: 'Optional TTL in seconds' }
      responses:
        '200':
          description: Created token (value returned once)
        '400':
          description: Validation error

  /api/tokens/{id}:
    delete:
      summary: Revoke API token
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Token revoked
        '404':
          description: Token not found

  /api/tokens/{id}/logs:
    get:
      summary: Get usage logs for a token
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of call logs for this token

  /api/endpoints:
    get:
      summary: List endpoints
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of endpoints with associations (apiTokens, schemas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EndpointWithAssociations'
    post:
      summary: Create endpoint
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpoint'
      responses:
        '200':
          description: Created endpoint
        '400':
          description: Validation error

  /api/endpoints/{id}:
    get:
      summary: Get endpoint by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Endpoint with associations
        '404':
          description: Not found
    patch:
      summary: Update endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpoint'
      responses:
        '200':
          description: Updated endpoint
        '404':
          description: Not found
    delete:
      summary: Delete endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found

  /api/endpoints/{id}/tokens:
    post:
      summary: Add API tokens to endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Tokens associated
        '404':
          description: Endpoint not found

  /api/endpoints/{id}/tokens/{tokenId}:
    delete:
      summary: Remove token from endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: tokenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Token removed
        '404':
          description: Not found

  /api/endpoints/{id}/schemas:
    post:
      summary: Add schemas (knowledge base) to endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schemaIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Schemas associated
        '404':
          description: Endpoint not found

  /api/endpoints/{id}/schemas/{schemaId}:
    delete:
      summary: Remove schema from endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: schemaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Schema removed
        '404':
          description: Not found

  /api/endpoints/{id}/logs:
    get:
      summary: Get call logs for endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: method
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          schema: { type: string, format: date-time }
        - name: sortBy
          in: query
          schema: { type: string }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Paginated call logs
        '404':
          description: Endpoint not found

  /api/schemas:
    get:
      summary: List schemas (knowledge base)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of schemas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schema'
    post:
      summary: Create schema
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchema'
      responses:
        '200':
          description: Created schema
        '400':
          description: Validation error

  /api/schemas/{id}:
    get:
      summary: Get schema by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '404':
          description: Not found
    patch:
      summary: Update schema
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSchema'
      responses:
        '200':
          description: Updated schema
        '404':
          description: Not found
    delete:
      summary: Delete schema
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found

  /api/schemas/{id}/sync-weaviate:
    post:
      summary: Manually sync schema chunks and graph into ArcadeDB
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Synced successfully
        '400':
          description: Schema must be published first
        '404':
          description: Not found
        '500':
          description: ArcadeDB sync failed

  /api/schemas/knowledge/batch-counts:
    post:
      summary: Batch ArcadeDB chunk counts for published schemas
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Map of schema id to count
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer }

  /api/schemas/{id}/knowledge/objects:
    get:
      summary: List knowledge chunk objects (max 500, truncated flag if more)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Objects and truncation flag
        '400':
          description: Not published
        '404':
          description: Schema not found
    post:
      summary: Create a chunk object in ArcadeDB
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1 }
                originalReference: { type: string }
                category: { type: string, maxLength: 50 }
                subcategory: { type: string, maxLength: 50 }
      responses:
        '200':
          description: Created id and chunkIndex
        '400':
          description: Validation or not published
        '404':
          description: Schema not found

  /api/schemas/{id}/knowledge/count:
    get:
      summary: Chunk count for a published schema
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Count (0 if draft)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /api/schemas/{id}/knowledge/search:
    post:
      summary: Search chunks (bm25, vector, or hybrid), max 10 results
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, mode]
              properties:
                query: { type: string, minLength: 1, maxLength: 4096 }
                mode: { type: string, enum: [bm25, vector, hybrid] }
      responses:
        '200':
          description: Matching objects
        '400':
          description: Validation or not published
        '404':
          description: Schema not found

  /api/schemas/{id}/knowledge/objects/{objectId}:
    patch:
      summary: Partial update chunk (omit keys you do not want to change)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              description: At least one of content, category, subcategory
              properties:
                content: { type: string, minLength: 1 }
                category: { type: string, maxLength: 50 }
                subcategory: { type: string, maxLength: 50 }
      responses:
        '200':
          description: Updated
        '400':
          description: Not published
        '404':
          description: Schema not found
    delete:
      summary: Delete a chunk object
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '400':
          description: Not published
        '404':
          description: Schema not found

  /api/logs/stats/24h:
    get:
      summary: Request count for last 24 hours (all user endpoints)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /api/v1/endpoints/{endpoint_id}/{user_id}:
    post:
      summary: Invoke dynamic endpoint (webhook)
      description: Call the endpoint. Use x-api-key header with a token associated to this endpoint.
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Endpoint response
        '404':
          description: Endpoint not found or inactive

  /api/v1/agents/{endpoint_id}/{user_id}:
    post:
      summary: Invoke native AI agent
      description: |
        Runs CRM collection (if triggered), then a pre-LLM topic gate, then an OpenAI
        tool-calling agent against ArcadeDB knowledge/graph plus Redis cache.
        Same x-api-key auth as /api/v1/endpoints. Does not forward to n8n.
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 16000 }
                conversation_id: { type: string, format: uuid }
              additionalProperties: true
      responses:
        '200':
          description: Agent reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  conversation_id: { type: string, format: uuid }
                  filtered: { type: boolean, description: True when the topic gate refused the turn without calling the chat model }
                  workflow: { type: boolean, description: True when a CRM collection workflow handled the turn }
        '400':
          description: Invalid body
        '403':
          description: API token invalid or missing
        '404':
          description: Endpoint not found or inactive

  /api/scrape-sources:
    get:
      summary: List scrape sources
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Scrape sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScrapeSource'
    post:
      summary: Create scrape source
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, seedUrl]
              properties:
                name: { type: string }
                seedUrl: { type: string, format: uri }
                schemaId: { type: string, format: uuid, nullable: true }
                allowedDomains: { type: array, items: { type: string } }
                maxDepth: { type: integer }
                maxPages: { type: integer }
                isActive: { type: boolean }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeSource'

  /api/scrape-sources/{id}:
    patch:
      summary: Update scrape source
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
    delete:
      summary: Delete scrape source
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted

  /api/scrape-sources/{id}/crawl:
    post:
      summary: Trigger crawl job
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Crawl queued or started inline
        '409':
          description: Crawl already running

  /api/scrape-sources/{id}/jobs:
    get:
      summary: List crawl jobs for a source
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Jobs

  /api/studio/query:
    post:
      summary: Run SQL or Cypher against the caller's knowledge database
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                language: { type: string, enum: [sql, cypher, gremlin], default: sql }
                command: { type: string }
                params: { type: object }
      responses:
        '200':
          description: Query result rows
        '400':
          description: Invalid query

  /api/studio/schema:
    get:
      summary: List types and indexes in the caller's knowledge database
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Types and indexes

  /api/endpoints/{id}/crm/webhooks:
    get:
      summary: List CRM webhooks for an endpoint
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Webhooks
    post:
      summary: Create a CRM webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                method: { type: string }
                headers: { type: object, additionalProperties: { type: string } }
                timeoutMs: { type: integer }
                enabled: { type: boolean }
      responses:
        '200':
          description: Created webhook

  /api/endpoints/{id}/crm/webhooks/{webhookId}/test:
    post:
      summary: Send a sample payload to a CRM webhook
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: webhookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: { type: object }
      responses:
        '200':
          description: Upstream status and body

  /api/endpoints/{id}/crm/schema:
    get:
      summary: Get CRM JSON Schema for collected fields
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: JSON Schema
    put:
      summary: Upsert CRM JSON Schema
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonSchema]
              properties:
                jsonSchema: { type: object }
      responses:
        '200':
          description: Saved schema

  /api/endpoints/{id}/crm/workflows:
    get:
      summary: List CRM collection workflows
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Workflows
    post:
      summary: Create a CRM collection workflow
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger, steps]
              properties:
                name: { type: string }
                webhookId: { type: string, format: uuid, nullable: true }
                trigger:
                  type: object
                  properties:
                    keywords: { type: array, items: { type: string } }
                    phrases: { type: array, items: { type: string } }
                steps:
                  type: array
                  items:
                    type: object
                    required: [field, prompt]
                    properties:
                      field: { type: string }
                      prompt: { type: string }
                      required: { type: boolean }
                confirmMessage: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Created workflow

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Schema:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        content: { type: string }
        systemPrompt:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional system prompt for AI agents (client hint; server does not enforce maxLength)
        version: { type: integer }
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateSchema:
      type: object
      required: [name, content]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        content: { type: string }
        systemPrompt: { type: string, nullable: true, maxLength: 5000 }
        isPublished: { type: boolean, default: false }

    UpdateSchema:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        content: { type: string }
        systemPrompt: { type: string, nullable: true, maxLength: 5000 }
        isPublished: { type: boolean }

    Token:
      type: object
      properties:
        id: { type: string, format: uuid }
        tokenName: { type: string }
        tokenPrefix: { type: string }
        isActive: { type: boolean }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }

    EndpointWithAssociations:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        routeName: { type: string }
        route: { type: string }
        rateLimit: { type: integer }
        rateLimitWindowMs: { type: integer }
        allowedOrigins: { type: array, items: { type: string } }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        topicFilter:
          type: object
          properties:
            enabled: { type: boolean }
            minSimilarity: { type: number }
            offTopicReply: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        apiTokens: { type: array, items: { $ref: '#/components/schemas/Token' } }
        schemas: { type: array }

    CreateEndpoint:
      type: object
      required: [routeName, route]
      properties:
        routeName: { type: string }
        route: { type: string }
        rateLimit: { type: integer }
        rateLimitWindowMs: { type: integer }
        allowedOrigins: { type: array, items: { type: string } }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        apiTokenIds: { type: array, items: { type: string, format: uuid } }
        schemaIds: { type: array, items: { type: string, format: uuid } }
        topicFilter:
          type: object
          properties:
            enabled: { type: boolean }
            minSimilarity: { type: number }
            offTopicReply: { type: string }

    UpdateEndpoint:
      type: object
      properties:
        routeName: { type: string }
        route: { type: string }
        rateLimit: { type: integer }
        rateLimitWindowMs: { type: integer }
        allowedOrigins: { type: array, items: { type: string } }
